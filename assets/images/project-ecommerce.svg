<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p1bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="p1shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="800" height="500" rx="20" fill="url(#p1bg)" />
  <!-- Grid lines background -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>
  <!-- Browser mockup frame -->
  <g filter="url(#p1shadow)">
    <rect x="70" y="50" width="660" height="400" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <!-- Browser header -->
    <rect x="70" y="50" width="660" height="42" rx="16" fill="#1e293b" />
    <circle cx="98" cy="71" r="5" fill="#ef4444" />
    <circle cx="116" cy="71" r="5" fill="#f59e0b" />
    <circle cx="134" cy="71" r="5" fill="#10b981" />
    <!-- URL bar -->
    <rect x="160" y="61" width="360" height="20" rx="10" fill="#0f172a" />
    <text x="180" y="75" fill="#94a3b8" font-family="sans-serif" font-size="11">https://nicha-storefront.io/analytics</text>
    
    <!-- Sidebar -->
    <rect x="70" y="92" width="130" height="358" fill="#111827" />
    <rect x="85" y="115" width="100" height="12" rx="6" fill="#6366f1" opacity="0.9" />
    <rect x="85" y="145" width="70" height="8" rx="4" fill="#475569" />
    <rect x="85" y="170" width="85" height="8" rx="4" fill="#475569" />
    <rect x="85" y="195" width="60" height="8" rx="4" fill="#475569" />
    <rect x="85" y="220" width="75" height="8" rx="4" fill="#475569" />

    <!-- Main Content -->
    <!-- Metric Cards -->
    <rect x="225" y="115" width="145" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="240" y="138" fill="#94a3b8" font-family="sans-serif" font-size="11">Total Revenue</text>
    <text x="240" y="165" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="18">฿ 452,800</text>

    <rect x="385" y="115" width="145" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="400" y="138" fill="#94a3b8" font-family="sans-serif" font-size="11">Active Orders</text>
    <text x="400" y="165" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="18">1,248 (+18%)</text>

    <rect x="545" y="115" width="160" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="560" y="138" fill="#94a3b8" font-family="sans-serif" font-size="11">Conversion Rate</text>
    <text x="560" y="165" fill="#f43f5e" font-family="sans-serif" font-weight="bold" font-size="18">4.85%</text>

    <!-- Chart Panel -->
    <rect x="225" y="200" width="480" height="230" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="245" y="228" fill="#f8fafc" font-family="sans-serif" font-weight="600" font-size="13">Monthly Sales Performance</text>
    
    <!-- Wave / Bars -->
    <path d="M 245 390 C 290 350, 330 380, 380 320 C 430 260, 480 310, 530 280 C 580 250, 630 270, 680 230" fill="none" stroke="#6366f1" stroke-width="3" />
    <path d="M 245 390 C 290 350, 330 380, 380 320 C 430 260, 480 310, 530 280 C 580 250, 630 270, 680 230 L 680 410 L 245 410 Z" fill="url(#chartGrad)" opacity="0.15" />
    
    <circle cx="380" cy="320" r="5" fill="#38bdf8" />
    <circle cx="530" cy="280" r="5" fill="#38bdf8" />
    <circle cx="680" cy="230" r="6" fill="#a855f7" />
  </g>
</svg>
