<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p3bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="p3shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="800" height="500" rx="20" fill="url(#p3bg)" />
  <circle cx="200" cy="80" r="160" fill="#34d399" opacity="0.1" />

  <g filter="url(#p3shadow)">
    <!-- Dashboard Card -->
    <rect x="100" y="60" width="600" height="380" rx="16" fill="#064e3b" stroke="#059669" stroke-width="1.5" />
    <!-- Header -->
    <rect x="100" y="60" width="600" height="50" rx="16" fill="#022c22" />
    <text x="130" y="92" fill="#6ee7b7" font-family="sans-serif" font-weight="bold" font-size="16">🌿 VitaPulse Daily Tracker</text>
    <rect x="560" y="73" width="110" height="24" rx="12" fill="#10b981" />
    <text x="580" y="89" fill="#022c22" font-family="sans-serif" font-weight="bold" font-size="11">Streak: 21 Days 🔥</text>

    <!-- Habit Rings / Stats -->
    <rect x="130" y="130" width="160" height="150" rx="12" fill="#022c22" stroke="#047857" stroke-width="1" />
    <!-- Circular progress -->
    <circle cx="210" cy="190" r="45" fill="none" stroke="#134e4a" stroke-width="10" />
    <circle cx="210" cy="190" r="45" fill="none" stroke="#34d399" stroke-width="10" stroke-dasharray="283" stroke-dashoffset="60" stroke-linecap="round" />
    <text x="195" y="196" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="16">78%</text>
    <text x="160" y="260" fill="#a7f3d0" font-family="sans-serif" font-size="12">Daily Goals Met</text>

    <!-- List of Habits -->
    <rect x="310" y="130" width="360" height="150" rx="12" fill="#022c22" stroke="#047857" stroke-width="1" />
    
    <rect x="330" y="145" width="22" height="22" rx="6" fill="#10b981" />
    <text x="335" y="161" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">✓</text>
    <text x="365" y="161" fill="#f0fdf4" font-family="sans-serif" font-size="13">ดื่มน้ำสะอาดครบ 2.5 ลิตร</text>
    <text x="600" y="161" fill="#34d399" font-family="sans-serif" font-size="11">สำเร็จ</text>

    <rect x="330" y="180" width="22" height="22" rx="6" fill="#10b981" />
    <text x="335" y="196" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">✓</text>
    <text x="365" y="196" fill="#f0fdf4" font-family="sans-serif" font-size="13">ออกกำลังกายเบา ๆ 30 นาที</text>
    <text x="600" y="196" fill="#34d399" font-family="sans-serif" font-size="11">สำเร็จ</text>

    <rect x="330" y="215" width="22" height="22" rx="6" fill="#10b981" />
    <text x="335" y="231" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">✓</text>
    <text x="365" y="231" fill="#f0fdf4" font-family="sans-serif" font-size="13">นั่งสมาธิ &amp; เขียน Journal ก่อนนอน</text>
    <text x="600" y="231" fill="#34d399" font-family="sans-serif" font-size="11">สำเร็จ</text>

    <rect x="330" y="250" width="22" height="22" rx="6" fill="#065f46" />
    <text x="365" y="265" fill="#a7f3d0" font-family="sans-serif" font-size="13">อ่านหนังสือบทความเทค 20 หน้า</text>
    <text x="590" y="265" fill="#fcd34d" font-family="sans-serif" font-size="11">กำลังทำ</text>

    <!-- Bottom Weekly Mood & Steps Graph -->
    <rect x="130" y="300" width="540" height="115" rx="12" fill="#022c22" stroke="#047857" stroke-width="1" />
    <text x="155" y="325" fill="#6ee7b7" font-family="sans-serif" font-weight="bold" font-size="12">Weekly Activity Level (ก้าวเดิน &amp; การพักผ่อน)</text>
    
    <!-- Step bars -->
    <g fill="#10b981">
      <rect x="160" y="360" width="35" height="40" rx="4" opacity="0.7" />
      <rect x="220" y="340" width="35" height="60" rx="4" opacity="0.8" />
      <rect x="280" y="335" width="35" height="65" rx="4" opacity="0.9" />
      <rect x="340" y="350" width="35" height="50" rx="4" opacity="0.7" />
      <rect x="400" y="325" width="35" height="75" rx="4" opacity="1" />
      <rect x="460" y="345" width="35" height="55" rx="4" opacity="0.8" />
      <rect x="520" y="330" width="35" height="70" rx="4" opacity="0.95" />
    </g>
    <text x="165" y="410" fill="#6ee7b7" font-family="sans-serif" font-size="9">จันทร์</text>
    <text x="225" y="410" fill="#6ee7b7" font-family="sans-serif" font-size="9">อังคาร</text>
    <text x="288" y="410" fill="#6ee7b7" font-family="sans-serif" font-size="9">พุธ</text>
    <text x="342" y="410" fill="#6ee7b7" font-family="sans-serif" font-size="9">พฤหัส</text>
    <text x="405" y="410" fill="#6ee7b7" font-family="sans-serif" font-size="9">ศุกร์</text>
    <text x="465" y="410" fill="#6ee7b7" font-family="sans-serif" font-size="9">เสาร์</text>
    <text x="522" y="410" fill="#6ee7b7" font-family="sans-serif" font-size="9">อาทิตย์</text>
  </g>
</svg>
