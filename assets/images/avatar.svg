<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdfc4" />
      <stop offset="100%" stop-color="#f5cbb1" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1810" />
      <stop offset="100%" stop-color="#1a0f0a" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Circle with ambient glow -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGrad)" filter="url(#softGlow)" opacity="0.3" />
  <circle cx="250" cy="250" r="215" fill="url(#bgGrad)" />

  <!-- Background decorative light rings -->
  <circle cx="250" cy="250" r="195" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />

  <g filter="url(#shadow)">
    <!-- Shoulders & Clothes -->
    <path d="M 120 450 C 130 380, 160 350, 250 350 C 340 350, 370 380, 380 450 Z" fill="url(#suitGrad)" />
    <!-- Shirt collar inner -->
    <polygon points="250,350 215,420 285,420" fill="url(#shirtGrad)" />
    <!-- Blazer lapels -->
    <polygon points="200,355 250,430 215,430 180,380" fill="#3730a3" />
    <polygon points="300,355 250,430 285,430 320,380" fill="#3730a3" />

    <!-- Neck -->
    <rect x="225" y="270" width="50" height="70" rx="10" fill="url(#skinGrad)" />
    <ellipse cx="250" cy="325" rx="25" ry="12" fill="#e2b79e" opacity="0.5" />

    <!-- Head & Face -->
    <ellipse cx="250" cy="225" rx="75" ry="92" fill="url(#skinGrad)" />

    <!-- Hair Back -->
    <path d="M 170 210 Q 155 330 190 350 Q 205 320 185 240 Z" fill="url(#hairGrad)" />
    <path d="M 330 210 Q 345 330 310 350 Q 295 320 315 240 Z" fill="url(#hairGrad)" />

    <!-- Ears & Modern Earrings -->
    <ellipse cx="174" cy="228" rx="10" ry="16" fill="url(#skinGrad)" />
    <ellipse cx="326" cy="228" rx="10" ry="16" fill="url(#skinGrad)" />
    <circle cx="174" cy="242" r="4" fill="#fbbf24" />
    <circle cx="326" cy="242" r="4" fill="#fbbf24" />

    <!-- Eyes -->
    <g fill="#2d2d2d">
      <ellipse cx="220" cy="220" rx="9" ry="11" />
      <ellipse cx="280" cy="220" rx="9" ry="11" />
      <!-- Eye Highlights -->
      <circle cx="223" cy="216" r="3.5" fill="#ffffff" />
      <circle cx="283" cy="216" r="3.5" fill="#ffffff" />
      <circle cx="217" cy="223" r="1.5" fill="#ffffff" />
      <circle cx="277" cy="223" r="1.5" fill="#ffffff" />
    </g>

    <!-- Eyebrows -->
    <path d="M 205 200 Q 220 193 235 198" fill="none" stroke="#2c1810" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 295 200 Q 280 193 265 198" fill="none" stroke="#2c1810" stroke-width="3.5" stroke-linecap="round" />

    <!-- Eyelashes -->
    <path d="M 210 212 Q 220 207 232 214" fill="none" stroke="#2d2d2d" stroke-width="2" stroke-linecap="round" />
    <path d="M 290 212 Q 280 207 268 214" fill="none" stroke="#2d2d2d" stroke-width="2" stroke-linecap="round" />

    <!-- Nose -->
    <path d="M 250 215 Q 252 238 245 244 Q 250 246 255 244" fill="none" stroke="#d49b7d" stroke-width="2.5" stroke-linecap="round" />

    <!-- Blush -->
    <ellipse cx="205" cy="240" rx="14" ry="7" fill="#f472b6" opacity="0.35" />
    <ellipse cx="295" cy="240" rx="14" ry="7" fill="#f472b6" opacity="0.35" />

    <!-- Smiling Lips -->
    <path d="M 233 260 Q 250 274 267 260" fill="none" stroke="#e11d48" stroke-width="3" stroke-linecap="round" />
    <path d="M 235 261 Q 250 271 265 261 Z" fill="#fb7185" />

    <!-- Stylish Hair Front / Bangs -->
    <path d="M 175 200 C 170 140, 210 120, 250 120 C 300 120, 330 145, 325 200 C 310 160, 280 150, 250 155 C 215 160, 190 170, 175 200 Z" fill="url(#hairGrad)" />
    <!-- Hair strands detail -->
    <path d="M 180 190 Q 210 145 250 148" fill="none" stroke="#4a2e21" stroke-width="2" opacity="0.6" />
    <path d="M 320 190 Q 290 145 250 148" fill="none" stroke="#4a2e21" stroke-width="2" opacity="0.6" />

    <!-- Chic Modern Glasses (Rose-Gold) -->
    <g fill="none" stroke="#f43f5e" stroke-width="3" opacity="0.95">
      <rect x="200" y="206" width="38" height="28" rx="8" />
      <rect x="262" y="206" width="38" height="28" rx="8" />
      <path d="M 238 217 L 262 217" />
      <path d="M 200 216 L 180 212" />
      <path d="M 300 216 L 320 212" />
    </g>
    <!-- Lens reflection -->
    <path d="M 206 211 L 222 211" stroke="#ffffff" stroke-width="2" opacity="0.7" stroke-linecap="round" />
    <path d="M 268 211 L 284 211" stroke="#ffffff" stroke-width="2" opacity="0.7" stroke-linecap="round" />
  </g>

  <!-- Sparkles & Floating Tech Elements -->
  <g fill="#fef08a">
    <path d="M 120 140 L 125 150 L 135 155 L 125 160 L 120 170 L 115 160 L 105 155 L 115 150 Z" opacity="0.85" />
    <path d="M 380 160 L 384 168 L 392 172 L 384 176 L 380 184 L 376 176 L 368 172 L 376 168 Z" opacity="0.85" />
    <circle cx="360" cy="120" r="5" fill="#38bdf8" />
    <circle cx="140" cy="270" r="4" fill="#a78bfa" />
    <circle cx="380" cy="290" r="5" fill="#f472b6" />
  </g>
</svg>
