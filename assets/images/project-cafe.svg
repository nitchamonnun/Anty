<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p2bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="p2shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="800" height="500" rx="20" fill="url(#p2bg)" />
  <!-- Circles backdrop -->
  <circle cx="150" cy="100" r="180" fill="#f59e0b" opacity="0.08" />
  <circle cx="700" cy="400" r="220" fill="#fbbf24" opacity="0.06" />

  <g filter="url(#p2shadow)">
    <!-- App Container / Mobile Frame & Web card preview -->
    <rect x="120" y="60" width="560" height="380" rx="16" fill="#1c1917" stroke="#44403c" stroke-width="1.5" />
    
    <!-- Header -->
    <rect x="120" y="60" width="560" height="50" rx="16" fill="#292524" />
    <circle cx="150" cy="85" r="12" fill="#d97706" />
    <text x="145" y="89" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">☕</text>
    <text x="175" y="90" fill="#fafaf9" font-family="sans-serif" font-weight="bold" font-size="14">SlowBar &amp; Cafe Explorer</text>
    <rect x="520" y="73" width="130" height="24" rx="12" fill="#d97706" />
    <text x="545" y="89" fill="#ffffff" font-family="sans-serif" font-size="11">📍 กรุงเทพฯ &amp; เชียงใหม่</text>

    <!-- Content Split -->
    <!-- Card 1 -->
    <rect x="150" y="130" width="235" height="135" rx="12" fill="#292524" stroke="#44403c" stroke-width="1" />
    <rect x="150" y="130" width="235" height="75" rx="12" fill="#78350f" opacity="0.7" />
    <text x="165" y="170" fill="#fef3c7" font-family="sans-serif" font-weight="bold" font-size="16">Aroma Roasters Lab</text>
    <text x="165" y="225" fill="#e7e5e4" font-family="sans-serif" font-weight="bold" font-size="13">Signature Dirty &amp; Pour Over</text>
    <text x="165" y="245" fill="#a8a29e" font-family="sans-serif" font-size="11">⭐ 4.9 (184 reviews) • สุขุมวิท 39</text>

    <!-- Card 2 -->
    <rect x="415" y="130" width="235" height="135" rx="12" fill="#292524" stroke="#44403c" stroke-width="1" />
    <rect x="415" y="130" width="235" height="75" rx="12" fill="#92400e" opacity="0.7" />
    <text x="430" y="170" fill="#fef3c7" font-family="sans-serif" font-weight="bold" font-size="16">Quiet Corner Garden</text>
    <text x="430" y="225" fill="#e7e5e4" font-family="sans-serif" font-weight="bold" font-size="13">Artisan Pastry &amp; Cold Brew</text>
    <text x="430" y="245" fill="#a8a29e" font-family="sans-serif" font-size="11">⭐ 4.8 (210 reviews) • อารีย์</text>

    <!-- Bottom Feature Bar -->
    <rect x="150" y="285" width="500" height="130" rx="12" fill="#292524" stroke="#44403c" stroke-width="1" />
    <text x="175" y="318" fill="#f59e0b" font-family="sans-serif" font-weight="bold" font-size="14">✨ ค้นพบเมล็ดกาแฟ Specialty &amp; รสชาติที่เหมาะกับคุณ</text>
    <text x="175" y="342" fill="#d6d3d1" font-family="sans-serif" font-size="12">ระบบ Filter กลิ่นรส (Floral, Fruity, Nutty, Chocolaty) พร้อมแผนที่พิกัดแบบเรียลไทม์</text>
    <rect x="175" y="365" width="100" height="30" rx="8" fill="#d97706" />
    <text x="195" y="384" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">เปิดระบบนำทาง</text>
    <rect x="290" y="365" width="100" height="30" rx="8" fill="#44403c" />
    <text x="315" y="384" fill="#e7e5e4" font-family="sans-serif" font-size="11">บันทึกที่ชื่นชอบ</text>
  </g>
</svg>
