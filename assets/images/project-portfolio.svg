    <rect x="500" y="125" width="80" height="60" rx="8" fill="#10b981" />
    <rect x="595" y="125" width="80" height="60" rx="8" fill="#f59e0b" />

    <!-- Button Components Preview -->
    <rect x="120" y="210" width="130" height="42" rx="21" fill="#8b5cf6" />
    <text x="148" y="236" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">Primary Glow</text>

    <rect x="270" y="210" width="130" height="42" rx="21" fill="none" stroke="#8b5cf6" stroke-width="2" />
    <text x="303" y="236" fill="#c4b5fd" font-family="sans-serif" font-weight="bold" font-size="12">Secondary</text>

    <rect x="420" y="210" width="130" height="42" rx="10" fill="#27272a" stroke="#52525b" stroke-width="1" />
