    <rect x="210" y="375" width="60" height="20" rx="10" fill="#10b981" opacity="0.3" />
    <text x="223" y="389" fill="#6ee7b7" font-family="sans-serif" font-size="10">Online</text>

    <rect x="410" y="275" width="265" height="140" rx="12" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <text x="430" y="305" fill="#a855f7" font-family="sans-serif" font-weight="bold" font-size="13">Modern Form Inputs</text>
    <rect x="430" y="325" width="225" height="34" rx="8" fill="#18181b" stroke="#6366f1" stroke-width="1.5" />
    <text x="445" y="347" fill="#818cf8" font-family="sans-serif" font-size="12">input:focus glowing state...</text>
    <rect x="430" y="372" width="130" height="24" rx="6" fill="#3f3f46" />
    <text x="445" y="388" fill="#d4d4d8" font-family="sans-serif" font-size="11">Toggle Switch ✓</text>
