    <rect x="570" y="210" width="105" height="42" rx="10" fill="#10b981" />
    <text x="600" y="236" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">Success</text>

    <!-- Components Grid Cards -->
    <rect x="120" y="275" width="260" height="140" rx="12" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <text x="140" y="305" fill="#f43f5e" font-family="sans-serif" font-weight="bold" font-size="13">Avatar &amp; Badge Groups</text>
    <circle cx="155" cy="340" r="16" fill="#6366f1" />
    <circle cx="180" cy="340" r="16" fill="#ec4899" />
    <circle cx="205" cy="340" r="16" fill="#f59e0b" />
    <circle cx="230" cy="340" r="16" fill="#10b981" />
    <rect x="140" y="375" width="60" height="20" rx="10" fill="#8b5cf6" opacity="0.3" />
