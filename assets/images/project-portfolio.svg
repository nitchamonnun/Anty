<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p4bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#c026d3" />
    </linearGradient>
    <filter id="p4shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="800" height="500" rx="20" fill="url(#p4bg)" />
  <circle cx="680" cy="120" r="140" fill="#f43f5e" opacity="0.15" />

  <g filter="url(#p4shadow)">
    <!-- Design Kit Artboard -->
    <rect x="90" y="55" width="620" height="390" rx="16" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
    
    <!-- Title bar -->
    <rect x="90" y="55" width="620" height="46" rx="16" fill="#27272a" />
    <circle cx="118" cy="78" r="5" fill="#ef4444" />
    <circle cx="136" cy="78" r="5" fill="#f59e0b" />
    <circle cx="154" cy="78" r="5" fill="#10b981" />
    <text x="180" y="82" fill="#e4e4e7" font-family="sans-serif" font-weight="bold" font-size="13">AuraDesign UI System v2.4 (Figma to Code)</text>

    <!-- Palette Swatches -->
    <rect x="120" y="125" width="80" height="60" rx="8" fill="#6366f1" />
    <rect x="215" y="125" width="80" height="60" rx="8" fill="#8b5cf6" />
    <rect x="310" y="125" width="80" height="60" rx="8" fill="#ec4899" />
